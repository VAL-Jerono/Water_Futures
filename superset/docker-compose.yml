# version field removed (obsolete in compose v2)

# ===========================================================================
# WATER FUTURES — Superset Stack (data home: Supabase)
# Postgres 15 (local fallback mirror)  |  Redis 7  |  Apache Superset 4.0.2
# Host ports 5435 / 6382 / 8091 — chosen to NOT clash with the
# CRD-TB stack (5432 / 6379 / 8088) so both can run side by side.
#
# Data home resolution (in scripts/load_data.py):
#   1. SUPABASE_DB_URI (or SUPABASE_DB_* parts) set  -> Supabase = data home
#   2. otherwise                                     -> local Postgres container
# ===========================================================================

name: water-futures

x-superset-env: &superset-env
  DATABASE_DB: superset
  DATABASE_HOST: postgres
  DATABASE_PASSWORD: superset_secret
  DATABASE_USER: superset
  DATABASE_PORT: "5432"
  DATABASE_DIALECT: postgresql
  POSTGRES_DB: superset
  POSTGRES_USER: superset
  POSTGRES_PASSWORD: superset_secret
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  SUPERSET_ENV: production
  SUPERSET_LOAD_EXAMPLES: "no"
  SUPERSET_SECRET_KEY: "water_futures_2026_secret_key_xyz789_change_in_prod"
  PYTHONPATH: /app/pythonpath
  # --- Supabase passthrough (set in superset/.env) ---
  SUPABASE_DB_URI: ${SUPABASE_DB_URI:-}
  SUPABASE_DB_HOST: ${SUPABASE_DB_HOST:-}
  SUPABASE_DB_PORT: ${SUPABASE_DB_PORT:-}
  SUPABASE_DB_USER: ${SUPABASE_DB_USER:-}
  SUPABASE_DB_PASSWORD: ${SUPABASE_DB_PASSWORD:-}
  SUPABASE_DB_NAME: ${SUPABASE_DB_NAME:-}

services:
  postgres:
    image: postgres:15
    container_name: wf_postgres
    environment:
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: superset_secret
      POSTGRES_DB: superset
    volumes:
      - pgdata_wf:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "superset"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: wf_redis
    ports:
      - "6382:6379"
    volumes:
      - redisdata_wf:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  superset:
    image: apache/superset:4.0.2
    container_name: wf_superset
    environment:
      <<: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
      - ./scripts:/scripts
      - ./data:/data:ro
      - superset_home_wf:/app/superset_home
    ports:
      - "8091:8088"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["bash", "/scripts/boot.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8088/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s

volumes:
  pgdata_wf:
  redisdata_wf:
  superset_home_wf: